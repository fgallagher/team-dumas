<style>
/* Layout: a secure-terminal archive. Index rail on the left (filters + file list), reading pane on the right; stacks to list-then-file on phones. */
:root {
  --bg: #eeece6;          /* filing-cabinet paper grey */
  --panel: #f8f7f3;       /* file sheet */
  --sunk: #e3e0d7;        /* quoted source block */
  --ink: #1c1f22;
  --muted: #646a6e;
  --rule: #c9c5ba;
  --accent: #1f4e5f;      /* Delphi teal-slate */
  --dispatch: #a3322a;    /* stamp red */
  --rumor: #7a6a3c;       /* brass */
  --sel: #dfe6e5;
  --focus: #2b7a8f;
  --f-type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --f-doc: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --s-reported: #2f5f86; --s-active: #2f7a46; --s-closed: #8a3a34;
  --c-core: #4b5a63; --c-aysle: #3b6a9a; --c-cyber: #6b4a8f; --c-living: #3f7a45;
  --c-nile: #a5781f; --c-orr: #7a4a32; --c-pan: #a33a3a; --c-thar: #5d6168;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191b; --panel: #1c2124; --sunk: #232a2e; --ink: #e4e2dc; --muted: #98a0a3; --rule: #343c40;
  --accent: #7fb4c4; --dispatch: #e0776c; --rumor: #cdb578; --sel: #26333a; --focus: #8fd0e2;
  --c-core: #a2b2bb; --c-aysle: #8db8e6; --c-cyber: #b99be0; --c-living: #8ec795; --c-nile: #e2b860; --c-orr: #d29a7f; --c-pan: #ec8b8b; --c-thar: #b1b6bd;
  --s-reported: #8fbde6; --s-active: #8fd3a0; --s-closed: #e79a92;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15191b; --panel: #1c2124; --sunk: #232a2e; --ink: #e4e2dc; --muted: #98a0a3; --rule: #343c40;
  --accent: #7fb4c4; --dispatch: #e0776c; --rumor: #cdb578; --sel: #26333a; --focus: #8fd0e2;
  --c-core: #a2b2bb; --c-aysle: #8db8e6; --c-cyber: #b99be0; --c-living: #8ec795; --c-nile: #e2b860; --c-orr: #d29a7f; --c-pan: #ec8b8b; --c-thar: #b1b6bd;
  --s-reported: #8fbde6; --s-active: #8fd3a0; --s-closed: #e79a92;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
.masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); padding-block: 10px 9px; margin-bottom: 18px; }
.masthead h1 { margin: 0; font-family: var(--f-type); font-weight: 700; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; }
.masthead .clear { font-family: var(--f-type); font-size: 12px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.masthead .asof { font-family: var(--f-type); font-size: 12px; letter-spacing: .08em; }
.masthead .asof b { color: var(--accent); font-weight: 700; }

.grid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 22px; align-items: start; }

/* index rail */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 40px); }
.search { width: 100%; padding: 9px 11px; border: 1px solid var(--rule); background: var(--panel); border-radius: 2px; }
.search::placeholder { color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--panel); padding: 3px 9px; border-radius: 2px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dotc, var(--muted)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.filters-label { font-family: var(--f-type); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.count { font-family: var(--f-type); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.count button { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--rule); min-height: 0; }
.list li { border-bottom: 1px solid var(--rule); }
.item { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 0 10px; width: 100%; text-align: left; background: none; border: none; padding: 10px 8px 10px 0; cursor: pointer; }
.item:hover { background: var(--sel); }
.item[aria-current="true"] { background: var(--sel); }
.item .bar { background: var(--cosm); border-radius: 1px; }
.item .top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-type); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .t { font-family: var(--f-doc); font-size: 16.5px; font-weight: 500; line-height: 1.25; margin-top: 3px; display: flex; gap: 7px; align-items: baseline; }
.item .t .new { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); transform: translateY(-2px); }
.kind { font-weight: 700; letter-spacing: .12em; }
.kind.dispatch { color: var(--dispatch); }
.kind.rumor { color: var(--rumor); }
.status { font-family: var(--f-type); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 0 6px; border-radius: 2px; border: 1px solid currentColor; }
.status.reported { color: var(--s-reported); } .status.personal { color: var(--accent); }
.kind.personal, .stamp.personal { color: var(--accent); }
.personal-doc blockquote { font-style: italic; } .status.active { color: var(--s-active); } .status.closed { color: var(--s-closed); }
.item .top .right { display: inline-flex; gap: 8px; align-items: center; }
.filterrow { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.chip .n { color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.empty { padding: 18px 4px; color: var(--muted); font-size: 14px; }

/* reading pane */
.file { background: var(--panel); border: 1px solid var(--rule); padding: 28px clamp(18px, 4vw, 44px) 34px; min-width: 0; }
.filehead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-family: var(--f-type); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid var(--rule); padding-bottom: 9px; }
.stamp { border: 2px solid currentColor; padding: 1px 8px; font-weight: 700; transform: rotate(-2deg); display: inline-block; }
.stamp.dispatch { color: var(--dispatch); } .stamp.rumor { color: var(--rumor); }
.file h2 { font-family: var(--f-doc); font-weight: 500; font-size: clamp(26px, 3.4vw, 34px); line-height: 1.1; margin: 18px 0 8px; text-wrap: balance; }
.meta { font-family: var(--f-type); font-size: 12.5px; letter-spacing: .06em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 22px; }
.meta .cosm { color: var(--cosm); font-weight: 700; }
.doc { font-family: var(--f-type); font-size: 14.5px; line-height: 1.6; max-width: 70ch; }
.doc p { margin: 0 0 12px; }
.doc > p:first-child { font-size: 13px; letter-spacing: .02em; border-left: 3px solid var(--ink); padding-left: 12px; margin-bottom: 18px; }
.doc blockquote { margin: 4px 0 18px; padding: 16px 20px; background: var(--sunk); border-left: 2px solid var(--rule); font-family: var(--f-doc); font-size: 17.5px; line-height: 1.55; }
.doc blockquote p { margin: 0 0 10px; } .doc blockquote p:last-child { margin: 0; }
.doc ul, .doc ol { padding-left: 26px; margin: 0 0 12px; } .doc li { margin-bottom: 5px; }
.doc hr { border: none; border-top: 1px dashed var(--rule); margin: 20px 0 14px; }
.doc > p:last-child { background: var(--sunk); padding: 10px 13px; }
.doc strong { font-weight: 700; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 12px; font-size: 14px; }
.pager button { background: none; border: none; color: var(--accent); cursor: pointer; padding: 4px 0; text-align: left; max-width: 48%; }
.pager button:last-child { text-align: right; }
.pager button[disabled] { visibility: hidden; }
.back { display: none; background: none; border: none; color: var(--accent); padding: 0 0 12px; cursor: pointer; font-family: var(--f-type); letter-spacing: .08em; font-size: 13px; }
.linkbtn { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font: inherit; letter-spacing: inherit; text-transform: inherit; }
.bulk { display: inline-flex; gap: 14px; }
.count { flex-wrap: wrap; row-gap: 4px; }
.count > span, .count button { white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 20px; }
.act { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--bg); padding: 4px 10px; border-radius: 2px; font-size: 13px; cursor: pointer; }
.act:hover { border-color: var(--muted); }
.bm { width: 10px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.act[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.act[aria-pressed="true"] .bm, .bm-on .bm { fill: currentColor; }
.bm-on { color: var(--accent); flex: none; display: inline-flex; margin-left: 2px; transform: translateY(1px); }
.foot { margin-top: 22px; font-family: var(--f-type); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: center; }

@media (max-width: 760px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; }
  .list { overflow: visible; }
  .app.reading .rail { display: none; }
  .app:not(.reading) .file { display: none; }
  .back { display: inline-block; }
  .file { padding: 20px 16px 26px; }
  .doc blockquote { padding: 13px 14px; font-size: 16.5px; }
}
@media (prefers-reduced-motion: no-preference) { .file { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; } to { opacity: 1; } } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="masthead">
    <h1>Delphi Council · Field Archive</h1>
    <span class="clear">Team Dumas · Gamma Clearance</span>
    <span class="asof">Current as of <b id="asof"></b></span>
  </header>
  <div class="grid">
    <aside class="rail" aria-label="File index">
      <input class="search" id="q" type="search" placeholder="Search files: Institute, Medina, Cavalcade…" aria-label="Search files">
      <div>
        <div class="filters-label">Realm</div>
        <div class="filters" id="cosms"></div>
      </div>
      <div class="filterrow">
        <div>
          <div class="filters-label">Type</div>
          <div class="filters" id="types"></div>
        </div>
        <div>
          <div class="filters-label">Status</div>
          <div class="filters" id="statuses"></div>
        </div>
        <div>
          <div class="filters-label">Show</div>
          <div class="filters" id="readf"></div>
        </div>
        <div>
          <div class="filters-label">Sort</div>
          <div class="filters" id="sortf"></div>
        </div>
      </div>
      <div class="count"><span id="count"></span><span class="bulk"><button id="markall" type="button" title="Applies to the files currently listed">Mark all read</button><button id="markallun" type="button" title="Applies to the files currently listed">Mark all unread</button></span></div>
      <ul class="list" id="list"></ul>
    </aside>
    <main class="file" id="file" aria-live="polite"></main>
  </div>
  <div class="foot" id="foot">Unread files are marked with a dot</div>
</div>

<script>
const DATA = {"asof": "2018-12-17", "asofDay": 264, "files": [{"id": "DC-1812-01", "date": "2018-12-07", "day": 254, "type": "Rumor", "status": "Reported", "title": "Beast blamed for Cairo break-ins", "locales": ["Nile Empire"], "html": "<p><strong>DELPHI COUNCIL — CAIRO STATION<\/strong><br />\n<strong>OPEN-SOURCE DIGEST<\/strong><br />\n<strong>SOURCE:<\/strong> Cairo street press. Byline: Juno Sinclair.<br />\n<strong>CLASSIFICATION:<\/strong> Rumor — Unverified<\/p>\n<blockquote>\n<p><strong>MONSTER AT LARGE? THIRD VAULT TORN OPEN IN TWO WEEKS!<\/strong><\/p>\n<p><em>Words and photographs by Juno Sinclair<\/em><\/p>\n<p>Police are baffled and shopkeepers are terrified after yet another Cairo strongroom was found ripped open overnight, its steel door bent back like the lid of a tin of sardines. It is the third such outrage in two weeks, and the story at each is the same: no tools, no explosives, no fingerprints. Just the door, torn from its hinges by something with the strength of ten men, and a few choice valuables gone.<\/p>\n<p>The sightings began two weeks ago. A night watchman at the Khan el-Khalili market, who asked not to be named, swears he saw \"a great dark shape, bigger than a man, climbing the wall like it was a ladder.\" A few nights later, a tram driver on the Heliopolis line braked hard for what he took to be a man in a fur coat crossing the tracks on all fours, until it stood up. And on Tuesday night, residents on the west bank complained of a smell like a menagerie and a terrible roar in the small hours.<\/p>\n<p>The authorities say there is no monster. The authorities have said a great many things. This reporter intends to find out what they are not saying.<\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> Three break-ins and at least three sightings in two weeks, all by something strong enough to tear open steel by hand. Local police have nothing. It's probably not a monster, but something is doing this, and it knows which doors are worth opening. Worth keeping an eye on.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> Something has torn open three vaults in Cairo in two weeks, ripping steel doors off by hand and taking only select valuables. Witnesses across the city describe a huge dark shape climbing walls, something on all fours crossing tram tracks, and a roar in the night. Police have no leads. Reported by Juno Sinclair.<\/p>", "text": "  DELPHI COUNCIL — CAIRO STATION  \n OPEN-SOURCE DIGEST  \n SOURCE:  Cairo street press. Byline: Juno Sinclair. \n CLASSIFICATION:  Rumor — Unverified \n \n  MONSTER AT LARGE? THIRD VAULT TORN OPEN IN TWO WEEKS!  \n  Words and photographs by Juno Sinclair  \n Police are baffled and shopkeepers are terrified after yet another Cairo strongroom was found ripped open overnight, its steel door bent back like the lid of a tin of sardines. It is the third such outrage in two weeks, and the story at each is the same: no tools, no explosives, no fingerprints. Just the door, torn from its hinges by something with the strength of ten men, and a few choice valuables gone. \n The sightings began two weeks ago. A night watchman at the Khan el-Khalili market, who asked not to be named, swears he saw \"a great dark shape, bigger than a man, climbing the wall like it was a ladder.\" A few nights later, a tram driver on the Heliopolis line braked hard for what he took to be a man in a fur coat crossing the tracks on all fours, until it stood up. And on Tuesday night, residents on the west bank complained of a smell like a menagerie and a terrible roar in the small hours. \n The authorities say there is no monster. The authorities have said a great many things. This reporter intends to find out what they are not saying. \n \n  ANALYST NOTE:  Three break-ins and at least three sightings in two weeks, all by something strong enough to tear open steel by hand. Local police have nothing. It's probably not a monster, but something is doing this, and it knows which doors are worth opening. Worth keeping an eye on. \n \n  TL;DR:  Something has torn open three vaults in Cairo in two weeks, ripping steel doors off by hand and taking only select valuables. Witnesses across the city describe a huge dark shape climbing walls, something on all fours crossing tram tracks, and a roar in the night. Police have no leads. Reported by Juno Sinclair. "}, {"id": "DC-1812-02", "date": "2018-12-09", "day": 256, "type": "Rumor", "status": "Reported", "title": "The new priests in the villas", "locales": ["Core Earth"], "html": "<p><strong>DELPHI COUNCIL — SOUTH AMERICA DESK<\/strong><br />\n<strong>SOURCE:<\/strong> Voicemail left at the Buenos Aires liaison office. Translated from Spanish.<\/p>\n<blockquote>\n<p><em>This is Father Ignacio Ruiz, at Our Lady of Caacupé in the 21-24. Someone from your office came to see me in October and left this number. I hope I am not wasting your time.<\/em><\/p>\n<p><em>They came about six weeks ago, a group of them, French and some Brazilians. They have a clinic in a container by the football pitch now. They give out insulin. Real insulin, when the pharmacies have none. They fixed the roof on Señora Paz's house in two days. They have permits for everything; I asked the police myself.<\/em><\/p>\n<p><em>I should be glad. People are being helped, and that is the Gospel. But my Mass was half empty on Sunday, and theirs was full. They pray for a Holy Father, and they do not mean the one who grew up a bus ride from here. When I ask my people what the priest says to them, they tell me he says the end is coming and that only one shepherd can keep them safe.<\/em><\/p>\n<p><em>I do not know what you can do. I only wanted someone to know.<\/em><\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> The same pattern has been reported in at least four other settlements across the capital. The bands are scrupulously legal, and the federal government has declined to interfere with humanitarian work. This was also the pattern in Rio before the invasion.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> CyberChurch missionaries are running clinics and repairs in Buenos Aires slums, preaching that the end is near, and drawing people away from local parishes.<\/p>", "text": "  DELPHI COUNCIL — SOUTH AMERICA DESK  \n SOURCE:  Voicemail left at the Buenos Aires liaison office. Translated from Spanish. \n \n  This is Father Ignacio Ruiz, at Our Lady of Caacupé in the 21-24. Someone from your office came to see me in October and left this number. I hope I am not wasting your time.  \n  They came about six weeks ago, a group of them, French and some Brazilians. They have a clinic in a container by the football pitch now. They give out insulin. Real insulin, when the pharmacies have none. They fixed the roof on Señora Paz's house in two days. They have permits for everything; I asked the police myself.  \n  I should be glad. People are being helped, and that is the Gospel. But my Mass was half empty on Sunday, and theirs was full. They pray for a Holy Father, and they do not mean the one who grew up a bus ride from here. When I ask my people what the priest says to them, they tell me he says the end is coming and that only one shepherd can keep them safe.  \n  I do not know what you can do. I only wanted someone to know.  \n \n  ANALYST NOTE:  The same pattern has been reported in at least four other settlements across the capital. The bands are scrupulously legal, and the federal government has declined to interfere with humanitarian work. This was also the pattern in Rio before the invasion. \n \n  TL;DR:  CyberChurch missionaries are running clinics and repairs in Buenos Aires slums, preaching that the end is near, and drawing people away from local parishes. "}, {"id": "DC-1812-03", "date": "2018-12-11", "day": 258, "type": "Dispatch", "status": "Reported", "title": "Wichita split over French missionaries", "locales": ["Core Earth"], "html": "<p><strong>DELPHI COUNCIL — NORTH AMERICA DESK<\/strong><br />\n<strong>SOURCE:<\/strong> <em>The Wichita Eagle<\/em>, local section. Excerpt.<\/p>\n<blockquote>\n<p>A group of fourteen missionaries from the self-styled \"Holy Cyber Conclave\" has spent the last two weeks running a food pantry and medical tent at the Century II refugee site, and the city doesn't agree on what to make of them.<\/p>\n<p>The group, led by a French priest who gives his name only as Père Mathieu, serves around 600 meals a day to displaced families from Illinois and Indiana. Volunteers say the missionaries have also re-roofed two shelter buildings, run a children's clinic, and fixed the site's failing generator.<\/p>\n<p>\"They showed up with trucks of food and they asked what we needed,\" said Teresa Okafor, who has lived at the site with her three children since August. \"The government gave us cots. These people gave us dinner.\"<\/p>\n<p>Not everyone is grateful. On Sunday, Bishop Carl Kemme instructed the diocese's parishes not to cooperate with the group, citing the Vatican's condemnation of the \"Antipope Malraux.\" About forty protesters gathered outside the site Tuesday with signs reading \"False Shepherd\" and \"Not Our Pope.\"<\/p>\n<p>Père Mathieu responded through a translator. \"We break no laws. We take nothing. We ask only to help. If the bishop wishes to bring the bread himself, we will gladly hand him the trucks.\"<\/p>\n<p>City Council member Dana Whitfield said she has received \"a lot of angry calls on both sides.\" The group's permits are in order, and its members entered the country legally on humanitarian visas. They say they will leave at the end of the month, and another group will replace them.<\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> This is the first confirmed CyberChurch mission band in the US interior. It follows the pattern in Buenos Aires: humanitarian relief, strict legality, and bands rotating every three weeks. The Desk notes that the band went to a refugee site rather than an established parish. Displaced populations have no local church loyalties to overcome.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> A CyberChurch mission band is feeding and caring for Living Land refugees in Wichita. Refugees welcome them, while the local bishop and protesters oppose them. Everything they do is legal, and another band is due to replace them at the end of the month.<\/p>", "text": "  DELPHI COUNCIL — NORTH AMERICA DESK  \n SOURCE:   The Wichita Eagle , local section. Excerpt. \n \n A group of fourteen missionaries from the self-styled \"Holy Cyber Conclave\" has spent the last two weeks running a food pantry and medical tent at the Century II refugee site, and the city doesn't agree on what to make of them. \n The group, led by a French priest who gives his name only as Père Mathieu, serves around 600 meals a day to displaced families from Illinois and Indiana. Volunteers say the missionaries have also re-roofed two shelter buildings, run a children's clinic, and fixed the site's failing generator. \n \"They showed up with trucks of food and they asked what we needed,\" said Teresa Okafor, who has lived at the site with her three children since August. \"The government gave us cots. These people gave us dinner.\" \n Not everyone is grateful. On Sunday, Bishop Carl Kemme instructed the diocese's parishes not to cooperate with the group, citing the Vatican's condemnation of the \"Antipope Malraux.\" About forty protesters gathered outside the site Tuesday with signs reading \"False Shepherd\" and \"Not Our Pope.\" \n Père Mathieu responded through a translator. \"We break no laws. We take nothing. We ask only to help. If the bishop wishes to bring the bread himself, we will gladly hand him the trucks.\" \n City Council member Dana Whitfield said she has received \"a lot of angry calls on both sides.\" The group's permits are in order, and its members entered the country legally on humanitarian visas. They say they will leave at the end of the month, and another group will replace them. \n \n  ANALYST NOTE:  This is the first confirmed CyberChurch mission band in the US interior. It follows the pattern in Buenos Aires: humanitarian relief, strict legality, and bands rotating every three weeks. The Desk notes that the band went to a refugee site rather than an established parish. Displaced populations have no local church loyalties to overcome. \n \n  TL;DR:  A CyberChurch mission band is feeding and caring for Living Land refugees in Wichita. Refugees welcome them, while the local bishop and protesters oppose them. Everything they do is legal, and another band is due to replace them at the end of the month. "}, {"id": "DC-1812-04", "date": "2018-12-12", "day": 259, "type": "Dispatch", "status": "Reported", "title": "The Diadem of Khar-Hotep", "locales": ["Nile Empire"], "html": "<p><strong>DELPHI COUNCIL — CASSANDRA DIVISION<\/strong><br />\n<strong>REQUEST FOR FIELD SUPPORT<\/strong><br />\n<strong>FROM:<\/strong> Omar Bednarczyk, Division Chief, Cassandra Division<br />\n<strong>TO:<\/strong> Team Dumas (routed via Hero Division)<br />\n<strong>RE:<\/strong> The Diadem of Khar-Hotep — Tariq al-Fulan gala, Cairo<br />\n<strong>CLASSIFICATION:<\/strong> Council Distribution — Discretion Required<\/p>\n<p>An artifact calling itself the Diadem of Khar-Hotep has surfaced in Cairo, in the hands of Tariq al-Fulan. Al-Fulan is an antiquities dealer with a reputation for asking no questions about where his merchandise comes from, and a longer reputation for friends in the city's crime families. The Diadem's provenance is unknown. It may be a genuine ancient piece, a relic, an Eternity Shard, or a very good forgery. Cassandra needs to know which.<\/p>\n<p>Al-Fulan is showing it off at a masked gala at his villa. He has invited Dr. Nadia Awan, a respected archaeologist, to authenticate the piece in front of his guests. Dr. Awan has quietly agreed to share her findings with this division. She is a civilian, and she will be spending the evening in a room full of people who would not take kindly to that.<\/p>\n<p>We expect members of at least three of Cairo's crime families to attend:<\/p>\n<ul>\n<li><strong>The Cairo Cartel<\/strong><\/li>\n<li><strong>The Hajjar Family<\/strong><\/li>\n<li><strong>The Tahan Family<\/strong>, who control the territory around al-Fulan's estate<\/li>\n<\/ul>\n<p>The objectives:<\/p>\n<ol>\n<li><strong>Protect Dr. Awan.<\/strong> Her safety comes first.<\/li>\n<li><strong>Monitor the crime families.<\/strong> Who attends, who talks to whom, and how interested each is in the Diadem.<\/li>\n<li><strong>Gather evidence of al-Fulan's involvement in illegal relic trafficking.<\/strong><\/li>\n<\/ol>\n<p>This is a surveillance and protection job, not a raid. The Council cannot be seen to have been there. Everyone at the gala will be masked, which is useful cover, but the team you send should not be faces anyone in Cairo would recognize. If Team Dumas judges that another team is better suited, Cassandra has no objection. We'd prefer it, frankly.<\/p>\n<p>Invitations and cover identities will be arranged through the Cairo station.<\/p>\n<p>— O. Bednarczyk<br />\nCassandra Division<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> Cassandra Division wants a discreet team at a masked gala in Cairo, hosted by antiquities dealer and suspected mob associate Tariq al-Fulan, who is showing off the Diadem of Khar-Hotep, an artifact of unknown origin. The team's job is to protect Dr. Nadia Awan, the archaeologist authenticating it, watch the three crime families expected to attend, and gather evidence of al-Fulan's relic trafficking. The team should not be anyone Cairo would recognize, so Team Dumas may assign it to another team.<\/p>", "text": "  DELPHI COUNCIL — CASSANDRA DIVISION  \n REQUEST FOR FIELD SUPPORT  \n FROM:  Omar Bednarczyk, Division Chief, Cassandra Division \n TO:  Team Dumas (routed via Hero Division) \n RE:  The Diadem of Khar-Hotep — Tariq al-Fulan gala, Cairo \n CLASSIFICATION:  Council Distribution — Discretion Required \n An artifact calling itself the Diadem of Khar-Hotep has surfaced in Cairo, in the hands of Tariq al-Fulan. Al-Fulan is an antiquities dealer with a reputation for asking no questions about where his merchandise comes from, and a longer reputation for friends in the city's crime families. The Diadem's provenance is unknown. It may be a genuine ancient piece, a relic, an Eternity Shard, or a very good forgery. Cassandra needs to know which. \n Al-Fulan is showing it off at a masked gala at his villa. He has invited Dr. Nadia Awan, a respected archaeologist, to authenticate the piece in front of his guests. Dr. Awan has quietly agreed to share her findings with this division. She is a civilian, and she will be spending the evening in a room full of people who would not take kindly to that. \n We expect members of at least three of Cairo's crime families to attend: \n \n  The Cairo Cartel  \n  The Hajjar Family  \n  The Tahan Family , who control the territory around al-Fulan's estate \n \n The objectives: \n \n  Protect Dr. Awan.  Her safety comes first. \n  Monitor the crime families.  Who attends, who talks to whom, and how interested each is in the Diadem. \n  Gather evidence of al-Fulan's involvement in illegal relic trafficking.  \n \n This is a surveillance and protection job, not a raid. The Council cannot be seen to have been there. Everyone at the gala will be masked, which is useful cover, but the team you send should not be faces anyone in Cairo would recognize. If Team Dumas judges that another team is better suited, Cassandra has no objection. We'd prefer it, frankly. \n Invitations and cover identities will be arranged through the Cairo station. \n — O. Bednarczyk \nCassandra Division \n \n  TL;DR:  Cassandra Division wants a discreet team at a masked gala in Cairo, hosted by antiquities dealer and suspected mob associate Tariq al-Fulan, who is showing off the Diadem of Khar-Hotep, an artifact of unknown origin. The team's job is to protect Dr. Nadia Awan, the archaeologist authenticating it, watch the three crime families expected to attend, and gather evidence of al-Fulan's relic trafficking. The team should not be anyone Cairo would recognize, so Team Dumas may assign it to another team. "}, {"id": "DC-1812-05", "date": "2018-12-12", "day": 259, "type": "Rumor", "status": "Reported", "title": "Something in chains for Céide Fields", "locales": ["Aysle"], "html": "<p><strong>DELPHI COUNCIL — IRELAND LIAISON, DUBLIN<\/strong><br />\n<strong>SOURCE:<\/strong> Note from a Fianna (Irish resistance) watcher on the cliffs above Belderg, County Mayo. Carried by hand.<\/p>\n<blockquote>\n<p><em>Longships in again three nights running. Usual cargo the first two: barrels, and people roped together. Third night was different. They brought something off the big ship that took forty men and a winch. Long as a lorry, wrapped in chains and black cloth. I had the glass on it the whole way up to the old fort. It moved under the cloth. Twice. I'm not drinking, before you ask.<\/em><\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> Céide Fields remains Uthorion's strongest position in Ireland. Whatever was delivered there was important enough to bring by sea under heavy guard.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> Viking longships delivered something huge, chained and possibly alive to Uthorion's Céide Fields stronghold in County Mayo.<\/p>", "text": "  DELPHI COUNCIL — IRELAND LIAISON, DUBLIN  \n SOURCE:  Note from a Fianna (Irish resistance) watcher on the cliffs above Belderg, County Mayo. Carried by hand. \n \n  Longships in again three nights running. Usual cargo the first two: barrels, and people roped together. Third night was different. They brought something off the big ship that took forty men and a winch. Long as a lorry, wrapped in chains and black cloth. I had the glass on it the whole way up to the old fort. It moved under the cloth. Twice. I'm not drinking, before you ask.  \n \n  ANALYST NOTE:  Céide Fields remains Uthorion's strongest position in Ireland. Whatever was delivered there was important enough to bring by sea under heavy guard. \n \n  TL;DR:  Viking longships delivered something huge, chained and possibly alive to Uthorion's Céide Fields stronghold in County Mayo. "}, {"id": "DC-1812-06", "date": "2018-12-13", "day": 260, "type": "Rumor", "status": "Reported", "title": "Which Volkov is in the Kremlin?", "locales": ["Tharkold"], "html": "<p><strong>DELPHI COUNCIL — MOSCOW DESK<\/strong><br />\n<strong>SOURCE:<\/strong> Bratva contact, Moscow. Paid. Reliability: fair.<\/p>\n<p>Our friend in the Brotherhood came to the meeting with two items and an asking price for each.<\/p>\n<p>First, he says his people move freight on the October Railway, and since early November the trains north to St. Petersburg have been heavy and the trains south have been empty. Office furniture, server racks, archive boxes, all under military escort. \"You do not move a ministry's filing cabinets to a city you plan to visit,\" he said. He also says the man giving speeches from the Kremlin every evening is not always Volkov. He would not say how he knows, and he charged double for it.<\/p>\n<p>Second, state television has started running segments on \"Ayslish provocations in the Gulf of Finland\": fishing boats lost, strange lights on the water, a coast guard cutter that came back with its crew changed. He laughed when we asked if it was true. \"Maybe. They are telling the people to be afraid of the Gulf. Someone wants them afraid before something happens.\"<\/p>\n<p><strong>ANALYST NOTE:<\/strong> St. Petersburg's hardpoints make it the most defensible city in the Wolf's territory. A quiet move of his government there, together with a media campaign about the Gulf, fits the pattern seen before the Baltic expansion in October. The Desk cannot confirm either item.<\/p>\n<p><em>Of interest to Agent Yevgeni Morozov:<\/em> The Desk looked into who is running the northbound freight. The October Railway contracts are held by Severnaya Logistika, a front registered in August. It is managed by one Grigori Lebedev, who our contacts identify as a senior man in the Morozov Syndicate, which they say has grown faster than any other in the Wolflands since the war began. Our Bratva source is from a rival family and was happy to sell us this.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> A Bratva contact claims Volkov is quietly moving his government to St. Petersburg and uses a double in the Kremlin. Russian state TV has started stoking fear of Ayslish aggression in the Gulf of Finland, possibly setting up a move like October's Baltic expansion. The freight is being run by the Morozov Syndicate, Yevgeni's family.<\/p>", "text": "  DELPHI COUNCIL — MOSCOW DESK  \n SOURCE:  Bratva contact, Moscow. Paid. Reliability: fair. \n Our friend in the Brotherhood came to the meeting with two items and an asking price for each. \n First, he says his people move freight on the October Railway, and since early November the trains north to St. Petersburg have been heavy and the trains south have been empty. Office furniture, server racks, archive boxes, all under military escort. \"You do not move a ministry's filing cabinets to a city you plan to visit,\" he said. He also says the man giving speeches from the Kremlin every evening is not always Volkov. He would not say how he knows, and he charged double for it. \n Second, state television has started running segments on \"Ayslish provocations in the Gulf of Finland\": fishing boats lost, strange lights on the water, a coast guard cutter that came back with its crew changed. He laughed when we asked if it was true. \"Maybe. They are telling the people to be afraid of the Gulf. Someone wants them afraid before something happens.\" \n  ANALYST NOTE:  St. Petersburg's hardpoints make it the most defensible city in the Wolf's territory. A quiet move of his government there, together with a media campaign about the Gulf, fits the pattern seen before the Baltic expansion in October. The Desk cannot confirm either item. \n  Of interest to Agent Yevgeni Morozov:  The Desk looked into who is running the northbound freight. The October Railway contracts are held by Severnaya Logistika, a front registered in August. It is managed by one Grigori Lebedev, who our contacts identify as a senior man in the Morozov Syndicate, which they say has grown faster than any other in the Wolflands since the war began. Our Bratva source is from a rival family and was happy to sell us this. \n \n  TL;DR:  A Bratva contact claims Volkov is quietly moving his government to St. Petersburg and uses a double in the Kremlin. Russian state TV has started stoking fear of Ayslish aggression in the Gulf of Finland, possibly setting up a move like October's Baltic expansion. The freight is being run by the Morozov Syndicate, Yevgeni's family. "}, {"id": "DC-1812-07", "date": "2018-12-15", "day": 262, "type": "Rumor", "status": "Reported", "title": "The Wardens are building on Arderin", "locales": ["Aysle"], "html": "<p><strong>DELPHI COUNCIL — IRELAND LIAISON, DUBLIN<\/strong><br />\n<strong>SOURCE:<\/strong> Verbal report from a Fianna (Irish resistance) courier, taken down by the liaison officer. Unverified.<\/p>\n<p>The courier came in from the midlands on foot and would not sit down until he'd been fed.<\/p>\n<blockquote>\n<p><em>\"The Wardens are building on Arderin. Stone walls going up on the peak, quick as you like, and they never build anything. They've been turning our lads back at the forest edge for months, polite enough, but now it's not polite. One of them told my cousin they were building for 'the worst day.' He asked which day that was. She didn't answer him.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> The Wardens have kept to themselves since the realm formed and have never needed a fortress before. Something has changed their minds.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> The elven Wardens in the Slieve Bloom mountains are hurriedly fortifying Arderin peak \"for the worst day,\" and have stopped letting anyone near.<\/p>", "text": "  DELPHI COUNCIL — IRELAND LIAISON, DUBLIN  \n SOURCE:  Verbal report from a Fianna (Irish resistance) courier, taken down by the liaison officer. Unverified. \n The courier came in from the midlands on foot and would not sit down until he'd been fed. \n \n  \"The Wardens are building on Arderin. Stone walls going up on the peak, quick as you like, and they never build anything. They've been turning our lads back at the forest edge for months, polite enough, but now it's not polite. One of them told my cousin they were building for 'the worst day.' He asked which day that was. She didn't answer him.\"  \n \n  ANALYST NOTE:  The Wardens have kept to themselves since the realm formed and have never needed a fortress before. Something has changed their minds. \n \n  TL;DR:  The elven Wardens in the Slieve Bloom mountains are hurriedly fortifying Arderin peak \"for the worst day,\" and have stopped letting anyone near. "}, {"id": "DC-1812-08", "date": "2018-12-15", "day": 262, "type": "Rumor", "status": "Reported", "title": "Who sent the lists?", "locales": ["Core Earth"], "html": "<p><strong>DELPHI COUNCIL — SOUTH AMERICA DESK<\/strong><br />\n<strong>SOURCE:<\/strong> Voice message forwarded through neighbourhood WhatsApp groups in La Matanza, Greater Buenos Aires. Passed to the Desk by an informant in San Justo. Translated from Spanish.<\/p>\n<blockquote>\n<p><em>Everyone in the group, listen, and pass this on. Everyone is saying it was hunger, but it wasn't only hunger. My cousin was there Thursday night. Before anything started, guys in a van went around handing out paper. Lists. Which supermarket, what time, which door the guard wouldn't be at. And some of them had money, cash, to get people moving. Nobody knows who they were. Not the unions, not the punteros. Nobody's claiming them.<\/em><\/p>\n<p><em>And then in the morning, after the police and the smoke and everything, who comes? The ones from the church container. With bread. With bandages. Smiling. The government didn't come. The church came.<\/em><\/p>\n<p><em>I'm just saying. Think about it.<\/em><\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> Lootings hit eleven supermarkets across the conurbano over two nights. December unrest is not new here, but the coordination is. Federal police made 140 arrests, and none of those arrested could identify the organisers. The Desk recommends treating the province as being in the preparation phase.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> Organised lootings swept Greater Buenos Aires. The organisers are unknown, and CyberChurch missionaries arrived the next morning with aid while the government looked absent.<\/p>", "text": "  DELPHI COUNCIL — SOUTH AMERICA DESK  \n SOURCE:  Voice message forwarded through neighbourhood WhatsApp groups in La Matanza, Greater Buenos Aires. Passed to the Desk by an informant in San Justo. Translated from Spanish. \n \n  Everyone in the group, listen, and pass this on. Everyone is saying it was hunger, but it wasn't only hunger. My cousin was there Thursday night. Before anything started, guys in a van went around handing out paper. Lists. Which supermarket, what time, which door the guard wouldn't be at. And some of them had money, cash, to get people moving. Nobody knows who they were. Not the unions, not the punteros. Nobody's claiming them.  \n  And then in the morning, after the police and the smoke and everything, who comes? The ones from the church container. With bread. With bandages. Smiling. The government didn't come. The church came.  \n  I'm just saying. Think about it.  \n \n  ANALYST NOTE:  Lootings hit eleven supermarkets across the conurbano over two nights. December unrest is not new here, but the coordination is. Federal police made 140 arrests, and none of those arrested could identify the organisers. The Desk recommends treating the province as being in the preparation phase. \n \n  TL;DR:  Organised lootings swept Greater Buenos Aires. The organisers are unknown, and CyberChurch missionaries arrived the next morning with aid while the government looked absent. "}, {"id": "DC-1812-09", "date": "2018-12-16", "day": 263, "type": "Rumor", "status": "Reported", "title": "Troubles in an Orrorsh safehouse", "locales": ["Orrorsh"], "html": "<p><strong>DELPHI COUNCIL — ORRORSH BRANCH, KOCHI STATION<\/strong><br />\n<strong>SOURCE:<\/strong> Personal letter, safehouse warden to Council liaison (recovered, water-damaged)<br />\n<strong>CLASSIFICATION:<\/strong> Handle With Care — Possible Compromise<\/p>\n<blockquote>\n<p>My dear friend,<\/p>\n<p>I do hope this finds you quickly. I write in some distress, though I beg you not to alarm the others unduly. I may yet be wrong, and I should hate to cause a fright over nothing. But I have now counted it out three times on the calendar, and the counting will not come out any other way.<\/p>\n<p>Five weeks ago young Mr. Pryce stopped being quite himself. It was small things at first. He took his tea without sugar, when he has taken three lumps since he was a boy. He hummed a tune none of us knew. He went off his supper entirely. Two days later he was gone. His bed had been slept in, his boots were by the door, and not a soul saw him leave.<\/p>\n<p>Nine days after that, Mrs. Aldous began to take her tea without sugar. She hummed the same tune, and she would not touch her supper. On the third day, she was gone as well.<\/p>\n<p>Nine days after Mrs. Aldous, it was our cook, Mr. Nair. He lasted barely a day.<\/p>\n<p>There is something else, and I hesitate to set it down. On each of the three nights our people vanished, someone in the town was found murdered. The papers have printed only the half of it, but the constable here is a friend, and he tells me the bodies were opened and the liver taken out of each, and not with any blade. He says it was done with teeth and claws. The dead were strangers to us and to one another, a clerk, a boatman, a widow, and I can find nothing to join them. Only the dates.<\/p>\n<p>I tell you all of this because it is now the ninth day since Mr. Nair, and I cannot tell whether Corporal Ashby has begun to change or whether I am simply frightened. The tea is no help to me. The Corporal has never taken sugar in his life. Last evening he would not come down to supper. He said he had taken a luncheon in the town that turned his stomach quite queer, and perhaps he had. This morning I heard him humming that tune, once, on the stair. But I cannot make much of that either, for we have all heard it so often now that none of us can get it out of our heads. I caught myself humming it over the washing-up on Sunday, and it gave me such a turn I had to sit down.<\/p>\n<p>I have not slept with my door unlocked since Mr. Pryce. I should very much appreciate a relief team at your earliest convenience. If the pattern holds, earlier will not be soon enough.<\/p>\n<p>Your servant in this dreadful business,<\/p>\n<p><em>[signature illegible]<\/em><\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> Two patterns, and they line up. Inside the safehouse: a resident starts behaving out of character, shows the same small peculiarities as the others, and disappears one to three days later, about every nine days. Three lost so far. In the town: a murder on each of those same three nights, victims with no apparent connection, each with the liver torn out by what the local constabulary describes as claws and teeth. The warden suspects Corporal Ashby is next, but each sign she reports has an innocent explanation: he never took sugar, he claims a bad lunch put him off supper, and the tune has lodged in every resident's head. If he is next, he has between one and three days, and another murder can be expected the night he disappears. The cause of either is unknown. Treat the safehouse as compromised.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> A Delphi safehouse in Kochi has lost three residents in five weeks. Each one started acting oddly (tea without sugar, humming an unfamiliar tune, refusing supper) and vanished one to three days later, about every nine days. On each of those nights, someone unconnected in town was murdered and had their liver torn out by claws and teeth. The warden fears a fourth resident, Corporal Ashby, is next: he skipped supper and was heard humming the tune once, though both have innocent explanations. The warden is asking for help now.<\/p>", "text": "  DELPHI COUNCIL — ORRORSH BRANCH, KOCHI STATION  \n SOURCE:  Personal letter, safehouse warden to Council liaison (recovered, water-damaged) \n CLASSIFICATION:  Handle With Care — Possible Compromise \n \n My dear friend, \n I do hope this finds you quickly. I write in some distress, though I beg you not to alarm the others unduly. I may yet be wrong, and I should hate to cause a fright over nothing. But I have now counted it out three times on the calendar, and the counting will not come out any other way. \n Five weeks ago young Mr. Pryce stopped being quite himself. It was small things at first. He took his tea without sugar, when he has taken three lumps since he was a boy. He hummed a tune none of us knew. He went off his supper entirely. Two days later he was gone. His bed had been slept in, his boots were by the door, and not a soul saw him leave. \n Nine days after that, Mrs. Aldous began to take her tea without sugar. She hummed the same tune, and she would not touch her supper. On the third day, she was gone as well. \n Nine days after Mrs. Aldous, it was our cook, Mr. Nair. He lasted barely a day. \n There is something else, and I hesitate to set it down. On each of the three nights our people vanished, someone in the town was found murdered. The papers have printed only the half of it, but the constable here is a friend, and he tells me the bodies were opened and the liver taken out of each, and not with any blade. He says it was done with teeth and claws. The dead were strangers to us and to one another, a clerk, a boatman, a widow, and I can find nothing to join them. Only the dates. \n I tell you all of this because it is now the ninth day since Mr. Nair, and I cannot tell whether Corporal Ashby has begun to change or whether I am simply frightened. The tea is no help to me. The Corporal has never taken sugar in his life. Last evening he would not come down to supper. He said he had taken a luncheon in the town that turned his stomach quite queer, and perhaps he had. This morning I heard him humming that tune, once, on the stair. But I cannot make much of that either, for we have all heard it so often now that none of us can get it out of our heads. I caught myself humming it over the washing-up on Sunday, and it gave me such a turn I had to sit down. \n I have not slept with my door unlocked since Mr. Pryce. I should very much appreciate a relief team at your earliest convenience. If the pattern holds, earlier will not be soon enough. \n Your servant in this dreadful business, \n  [signature illegible]  \n \n  ANALYST NOTE:  Two patterns, and they line up. Inside the safehouse: a resident starts behaving out of character, shows the same small peculiarities as the others, and disappears one to three days later, about every nine days. Three lost so far. In the town: a murder on each of those same three nights, victims with no apparent connection, each with the liver torn out by what the local constabulary describes as claws and teeth. The warden suspects Corporal Ashby is next, but each sign she reports has an innocent explanation: he never took sugar, he claims a bad lunch put him off supper, and the tune has lodged in every resident's head. If he is next, he has between one and three days, and another murder can be expected the night he disappears. The cause of either is unknown. Treat the safehouse as compromised. \n \n  TL;DR:  A Delphi safehouse in Kochi has lost three residents in five weeks. Each one started acting oddly (tea without sugar, humming an unfamiliar tune, refusing supper) and vanished one to three days later, about every nine days. On each of those nights, someone unconnected in town was murdered and had their liver torn out by claws and teeth. The warden fears a fourth resident, Corporal Ashby, is next: he skipped supper and was heard humming the tune once, though both have innocent explanations. The warden is asking for help now. "}, {"id": "DC-1812-10", "date": "2018-12-16", "day": 263, "type": "Dispatch", "status": "Reported", "title": "Medina hardpoint reduced to the city core", "locales": ["Nile Empire"], "html": "<p><strong>DELPHI COUNCIL — MIDDLE EAST DESK<\/strong><br />\n<strong>SITUATION REPORT<\/strong><br />\n<strong>SOURCE:<\/strong> Council liaison inside Medina, relayed through Mecca<br />\n<strong>CLASSIFICATION:<\/strong> Council Distribution<\/p>\n<p>The Core Earth zone around Medina has collapsed to the old city. As of this morning it holds the Prophet's Mosque and the streets immediately around it, and nothing beyond.<\/p>\n<p>The change was not a single assault. Battlegroup Natatiri has kept up steady pressure on the perimeter for months, and the hardpoint has been giving ground a little at a time. Over the past week the losses accelerated, and the last of the outer districts went over in the reality storms of the last two nights. Residents who stayed in those districts have transformed. Those who could reach the core did.<\/p>\n<p>Conditions in the core:<\/p>\n<ul>\n<li><strong>Overcrowded.<\/strong> The population of most of the city is now living in a fraction of it. The mosque grounds, courtyards, and every building inside the zone are full.<\/li>\n<li><strong>Cut off by ground.<\/strong> The storms around the city are as violent as any recorded around a hardpoint. No road route is currently passable.<\/li>\n<li><strong>Short of food and medicine.<\/strong> Supply now depends on what can be carried in from Mecca, where the situation is the reverse: the hardpoint there is holding and has grown.<\/li>\n<li><strong>Holding.<\/strong> The imams and the civil leadership are keeping order. Morale is better than the numbers would suggest.<\/li>\n<\/ul>\n<p><strong>ANALYST NOTE:<\/strong> Archimedes Division's working theory is that the hardpoint is being drained faster than the people inside can sustain it. Mecca, with more faithful under a stronger hardpoint, is refilling faster than it loses. Medina is not. If the trend continues, the city will fall. The Council's best options are the same as before: keep supply moving from Mecca, and evacuate those who are willing to go. Teams with experience moving through reality storms should contact the Middle East Desk.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> Medina's Core Earth hardpoint has shrunk to the old city around the Prophet's Mosque after months of pressure from Battlegroup Natatiri. Everyone who could get there is now packed into the core, cut off by violent reality storms and short on food and medicine, supplied only from Mecca, whose hardpoint is holding and even growing. Archimedes thinks Medina is being drained faster than it can recover. Teams experienced with reality storms are asked to help with supply and evacuation.<\/p>", "text": "  DELPHI COUNCIL — MIDDLE EAST DESK  \n SITUATION REPORT  \n SOURCE:  Council liaison inside Medina, relayed through Mecca \n CLASSIFICATION:  Council Distribution \n The Core Earth zone around Medina has collapsed to the old city. As of this morning it holds the Prophet's Mosque and the streets immediately around it, and nothing beyond. \n The change was not a single assault. Battlegroup Natatiri has kept up steady pressure on the perimeter for months, and the hardpoint has been giving ground a little at a time. Over the past week the losses accelerated, and the last of the outer districts went over in the reality storms of the last two nights. Residents who stayed in those districts have transformed. Those who could reach the core did. \n Conditions in the core: \n \n  Overcrowded.  The population of most of the city is now living in a fraction of it. The mosque grounds, courtyards, and every building inside the zone are full. \n  Cut off by ground.  The storms around the city are as violent as any recorded around a hardpoint. No road route is currently passable. \n  Short of food and medicine.  Supply now depends on what can be carried in from Mecca, where the situation is the reverse: the hardpoint there is holding and has grown. \n  Holding.  The imams and the civil leadership are keeping order. Morale is better than the numbers would suggest. \n \n  ANALYST NOTE:  Archimedes Division's working theory is that the hardpoint is being drained faster than the people inside can sustain it. Mecca, with more faithful under a stronger hardpoint, is refilling faster than it loses. Medina is not. If the trend continues, the city will fall. The Council's best options are the same as before: keep supply moving from Mecca, and evacuate those who are willing to go. Teams with experience moving through reality storms should contact the Middle East Desk. \n \n  TL;DR:  Medina's Core Earth hardpoint has shrunk to the old city around the Prophet's Mosque after months of pressure from Battlegroup Natatiri. Everyone who could get there is now packed into the core, cut off by violent reality storms and short on food and medicine, supplied only from Mecca, whose hardpoint is holding and even growing. Archimedes thinks Medina is being drained faster than it can recover. Teams experienced with reality storms are asked to help with supply and evacuation. "}, {"id": "DC-1812-11", "date": "2018-12-16", "day": 263, "type": "Rumor", "status": "Reported", "title": "Horns in the hills above Kinnitty", "locales": ["Aysle"], "html": "<p><strong>DELPHI COUNCIL — IRELAND LIAISON, DUBLIN<\/strong><br />\n<strong>SOURCE:<\/strong> Overheard in a pub in Kinnitty, County Offaly, by a liaison officer passing through.<\/p>\n<blockquote>\n<p><em>There's an old fella at the end of the bar, ninety if he's a day, telling anyone who'll listen that he's been hearing horns up in the hills at night. Hunting horns. And dogs baying that weren't dogs, he says, too deep for dogs. The barman says he's away with the fairies. Somebody else said, these days, he might be. Nobody laughed.<\/em><\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> Kinnitty sits at the foot of the Slieve Bloom mountains. Included for completeness.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> An old man near Slieve Bloom claims to hear hunting horns and baying \"dogs that weren't dogs\" in the hills at night.<\/p>", "text": "  DELPHI COUNCIL — IRELAND LIAISON, DUBLIN  \n SOURCE:  Overheard in a pub in Kinnitty, County Offaly, by a liaison officer passing through. \n \n  There's an old fella at the end of the bar, ninety if he's a day, telling anyone who'll listen that he's been hearing horns up in the hills at night. Hunting horns. And dogs baying that weren't dogs, he says, too deep for dogs. The barman says he's away with the fairies. Somebody else said, these days, he might be. Nobody laughed.  \n \n  ANALYST NOTE:  Kinnitty sits at the foot of the Slieve Bloom mountains. Included for completeness. \n \n  TL;DR:  An old man near Slieve Bloom claims to hear hunting horns and baying \"dogs that weren't dogs\" in the hills at night. "}, {"id": "DC-1812-12", "date": "2018-12-17", "day": 264, "type": "Dispatch", "status": "Reported", "title": "Lost extraction: Institute defector", "locales": ["Tharkold"], "html": "<p><strong>DELPHI COUNCIL — TACTICAL SIGNALS, MOSCOW DESK<\/strong><br />\n<strong>SOURCE:<\/strong> Fragmentary radio traffic, encrypted, partial recovery only<br />\n<strong>CLASSIFICATION:<\/strong> MIA — Presumed Compromised<\/p>\n<blockquote>\n<p>[BEGIN RECOVERED FRAGMENT]<\/p>\n<p>...negative on extraction point, repeat negative, the Institute knows we're—<\/p>\n<p>[signal lost — 40 seconds silence]<\/p>\n<p>...if anyone's receiving this, the asset is real, the asset is scared, and the asset is the only reason Volkov hasn't already— [garbled] —Wolf's people are already inside the perimeter, I don't think we're going to—<\/p>\n<p>[END RECOVERED FRAGMENT]<\/p>\n<\/blockquote>\n<p><strong>ANALYST NOTE:<\/strong> This is the last transmission received from the extraction team sent to pull a defector out of the Institute during the current factional violence. No further contact. Team status: MIA. The defector's identity, and the reason \"the Wolf's\" people want them badly enough to compromise an extraction team, both remain unconfirmed. Given Yevgeni's history with the Institute, recommend he's read in before any follow-up mission.<\/p>\n<hr />\n<p><strong>TL;DR:<\/strong> A Delphi team sent into Tharkold to extract a defector from the Institute has gone silent and is listed as MIA. Their last transmission confirms the defector is real and that the Wolf's forces had reached them. Nobody knows who the defector is yet. Yevgeni should be briefed before any follow-up mission.<\/p>", "text": "  DELPHI COUNCIL — TACTICAL SIGNALS, MOSCOW DESK  \n SOURCE:  Fragmentary radio traffic, encrypted, partial recovery only \n CLASSIFICATION:  MIA — Presumed Compromised \n \n [BEGIN RECOVERED FRAGMENT] \n ...negative on extraction point, repeat negative, the Institute knows we're— \n [signal lost — 40 seconds silence] \n ...if anyone's receiving this, the asset is real, the asset is scared, and the asset is the only reason Volkov hasn't already— [garbled] —Wolf's people are already inside the perimeter, I don't think we're going to— \n [END RECOVERED FRAGMENT] \n \n  ANALYST NOTE:  This is the last transmission received from the extraction team sent to pull a defector out of the Institute during the current factional violence. No further contact. Team status: MIA. The defector's identity, and the reason \"the Wolf's\" people want them badly enough to compromise an extraction team, both remain unconfirmed. Given Yevgeni's history with the Institute, recommend he's read in before any follow-up mission. \n \n  TL;DR:  A Delphi team sent into Tharkold to extract a defector from the Institute has gone silent and is listed as MIA. Their last transmission confirms the defector is real and that the Wolf's forces had reached them. Nobody knows who the defector is yet. Yevgeni should be briefed before any follow-up mission. "}], "sealed": [{"p": "torrey", "iv": "Xhb_r5f5Bpd9IC62", "ct": "gLOJ_d57V1YSdk1s5nOn-A4VA6bUcZ5jCgLXCJZjMptFUWQS_zJCVsxA6Se_VUtcgr86kOZzyrnczUBc5IDuJvoiX4HN1jEezsGxhG4jcjyLbycIKkp66sV2PKyGSvbS1E41V9IPoB6XRe1rrpmJVXCV4sFb5oBgpPT1tHP2y6ZFpLQIl6ELo1OtALpwLJ7x1Y2RKrfxCOZZzw5VdPShUIPvUv0UUEzjxCaM_hAr800UoDgsDaHQo0aq-QjQR66XfFdiR4fD9MKk8PX7rxCh5U1S1ux3dVbi18JmYR4Z-dtn8mqwSWU0o1T4KcIbRLb8W_GwV7KWUqMi2rqgaLnXeUGxpn6meN5MZZ4k3CiT3UYCE2GYer_69YLlolcCmi7aA1KZQCD76Gr0yuCY9BCfTkfF7p6rVXUSFO3skH_JMHfi36YBFbtYxdURFalRS_ChAAM29c9PsdTuKl4Jkbyl3ftQSHNfAdValZ0uNAnRgSOOreJk4gG7PgDQ6HYx_iAZCLa_pSGV4ww5HM2WOaMaFsruZGzUSp3z7NeECISX71sbKRhSNQYptAc8rS1qY9Jf3KgGrbGbSPje_btHoWsHtQqR5zOzLCuqKCILZeyD6x-9A9Q6fFZqice8V_vMWk9K2rzleEJXFrEmT_yOS8n-Wn5qQaGiB4Om_C-nOyJOquVhTZ6mevMtrYmJrsbgLxkUVhr9z6i4JOQAeBYXxs11Q0uEDEYgQE8Sob3xbqZTN_Keq6dHlT1e9CZfPbLPuoxHzsHvgGg_8yOsHZiJkwjG2EuIxlI2rbYPzH2xZGCQgYLfBP2Ntdk92nOKZaCcTvMo10yRXAXEWGF-5WN0l6SGdF3oUUX9J2wbySNgtoJZbKKjSWSK72ljcl1oDIZle0EybJKgVWiKp9L7GVfwxb3jZFbQNdUT_rpbz-qCjnEmO5e1OQKEqyo0ESzONVCzvsGkA33jDy0_oMDm9ley9mpREBSTI0d0EiehoqTIK9SpNqjZxrXML4noZIielAMmQFYQz-ZjI9nXaeHRHls5hOgvboba19mSIV9iCVKZfCd-0Bjs8QkjLK1WQQxWOFdHRdEgznavla5LwbQxwmAf4Zu1_rkiMaS8XRQ1S1yi-kJYaQAaOyJsgib7x7yFtPT23Fhh3pMJUo20UvfBk5vXKsLs-YQ6sYi0BGolNAMBIjnOUoU71CTbcgLRVymfoSlpZDhvskmQkxka_x9vwc2gEzmnoTr8ksxPgQ0VBt4rUJAgflL9WQI0gJtHZ-j7Sr7e-Zkl6plJVrj4boNZuxIdGl_NmI_etM-w79vZHdAfEIu3nlomX1KM7RRSHHa7cwpIyBX88lhiQDPR7AkQDKwjGc-6wUxoz94EXBCsxO5CA6 const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* Personal correspondence: sealed per player with AES-GCM. A player's link carries #k=player.key;
   the key stays in the URL fragment (never sent to the server) and in this browser's storage. */
const b64d = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
function takeKeys() {
  const keys = store.get("dfa-keys", {});
  const h = location.hash || "";
  if (h.startsWith("#k=")) {
    h.slice(3).split(",").forEach(pair => { const i = pair.indexOf("."); if (i > 0) keys[pair.slice(0, i)] = pair.slice(i + 1); });
    store.set("dfa-keys", keys);
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  }
  return keys;
}
async function unseal(keys) {
  const out = [];
  if (!window.crypto || !crypto.subtle) return out;
  for (const s of DATA.sealed || []) {
    if (!keys[s.p]) continue;
    try {
      const k = await crypto.subtle.importKey("raw", b64d(keys[s.p]), "AES-GCM", false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(s.iv) }, k, b64d(s.ct));
      out.push(JSON.parse(new TextDecoder().decode(pt)));
    } catch {}
  }
  return out;
}

function chip(container, label, set, color) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", "false");
  b.innerHTML = (color ? `<span class="dot" style="--dotc:${color}"></span>` : "") + label;
  b.onclick = () => { set.has(label) ? set.delete(label) : set.add(label); b.setAttribute("aria-pressed", set.has(label)); render(); };
  container.appendChild(b);
}
STATUSES.forEach(t => chip(document.getElementById("statuses"), t, state.statuses));
const readBtns = ["All", "Unread", "Read", "Bookmarked"].map(t => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = t; b.setAttribute("aria-pressed", t === state.readf);
  b.onclick = () => { state.readf = t; readBtns.forEach(x => x.setAttribute("aria-pressed", x.textContent === t)); render(); };
  document.getElementById("readf").appendChild(b); return b;
});
const SORT_KEY = "dfa-sort";
state.sort = store.get(SORT_KEY, "Newest first");
const sortBtns = ["Newest first", "Oldest first"].map(t => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = t; b.setAttribute("aria-pressed", t === state.sort);
  b.onclick = () => { state.sort = t; store.set(SORT_KEY, t); sortBtns.forEach(x => x.setAttribute("aria-pressed", x.textContent === t)); if (state.current) open(state.current, false); else render(); };
  document.getElementById("sortf").appendChild(b); return b;
});

const plain = f => (f.title + " " + f.text + " " + f.locales.join(" ")).toLowerCase();
function visible() {
  const q = state.q.trim().toLowerCase();
  const list = state.sort === "Oldest first" ? files.slice().reverse() : files;
  return list.filter(f =>
    (!state.cosms.size || f.locales.some(c => state.cosms.has(c))) &&
    (!state.types.size || state.types.has(f.type)) &&
    (!state.statuses.size || state.statuses.has(f.status)) &&
    (state.readf === "All" || f.id === state.current ||
      (state.readf === "Bookmarked" ? marks.has(f.id) : (state.readf === "Unread") === !read.has(f.id))) &&
    (!q || q.split(/\s+/).every(w => plain(f).includes(w))));
}

function render() {
  const v = visible();
  const unread = files.filter(f => !read.has(f.id)).length;
  document.getElementById("count").textContent = `${v.length} of ${files.length} files · ${unread} unread`;
  const ul = document.getElementById("list"); ul.innerHTML = "";
  if (!v.length) { ul.innerHTML = `<li class="empty">No files match. Clear the search or a filter to see more.</li>`; }
  v.forEach(f => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.className = "item"; b.style.setProperty("--cosm", cv(f.locales[0]));
    if (f.id === state.current) b.setAttribute("aria-current", "true");
    b.innerHTML = `<span class="bar"></span><span><span class="top"><span>${fmt(f.date)} · Day ${f.day}</span><span class="right">${f.status !== "Reported" && f.type !== "Personal" ? `<span class="status ${f.status.toLowerCase()}">${f.status}</span>` : ""}<span class="kind ${f.type.toLowerCase()}">${f.type.toUpperCase()}</span></span></span>
      <span class="t">${read.has(f.id) ? "" : '<span class="new" title="Unread"></span>'}<span>${f.title}</span>${marks.has(f.id) ? `<span class="bm-on" title="Bookmarked">${BM}</span>` : ""}</span></span>`;
    b.onclick = () => open(f.id, true);
    li.appendChild(b); ul.appendChild(li);
  });
}

function open(id, user) {
  const f = files.find(x => x.id === id); if (!f) return;
  state.current = id; if (user) { read.add(id); saveRead(); }
  const v = visible(); const i = v.findIndex(x => x.id === id);
  const newer = v[i - 1], older = v[i + 1]; // previous / next in current list order
  const el = document.getElementById("file");
  el.style.setProperty("--cosm", cv(f.locales[0]));
  el.innerHTML = `<button class="back" type="button" id="back">← All files</button>
    <div class="filehead"><span>File ${f.id} &nbsp; ${f.type === "Personal" ? `<span class="status personal">For ${f.to}</span>` : `<span class="status ${f.status.toLowerCase()}">${f.status}</span>`}</span><span class="stamp ${f.type.toLowerCase()}">${f.type}</span></div>
    <h2>${f.title}</h2>
    <div class="meta"><span>${f.type === "Personal" ? "Received" : "Reported"} ${fmt(f.date)}</span><span>Day ${f.day} of the war</span>${f.locales.map(c => `<span class="cosm" style="color:${cv(c)}">${c}</span>`).join("")}</div>
    <div class="actions"><button type="button" id="bmbtn" class="act" aria-pressed="${marks.has(f.id)}">${BM}<span>${marks.has(f.id) ? "Bookmarked" : "Bookmark"}</span></button><button type="button" id="rdbtn" class="act">${read.has(f.id) ? "Mark unread" : "Mark read"}</button></div>
    <article class="doc${f.type === "Personal" ? " personal-doc" : ""}">${f.html}</article>
    <nav class="pager"><button type="button" id="newer" ${newer ? "" : "disabled"}>← ${newer ? newer.title : ""}</button><button type="button" id="older" ${older ? "" : "disabled"}>${older ? older.title : ""} →</button></nav>`;
  el.querySelector("#bmbtn").onclick = () => {
    marks.has(id) ? marks.delete(id) : marks.add(id); saveMarks();
    const b = el.querySelector("#bmbtn"); b.setAttribute("aria-pressed", marks.has(id)); b.querySelector("span").textContent = marks.has(id) ? "Bookmarked" : "Bookmark"; render();
  };
  el.querySelector("#rdbtn").onclick = () => {
    read.has(id) ? read.delete(id) : read.add(id); saveRead();
    el.querySelector("#rdbtn").textContent = read.has(id) ? "Mark unread" : "Mark read"; render();
  };
  if (newer) el.querySelector("#newer").onclick = () => open(newer.id, true);
  if (older) el.querySelector("#older").onclick = () => open(older.id, true);
  el.querySelector("#back").onclick = () => { document.getElementById("app").classList.remove("reading"); render(); };
  document.getElementById("app").classList.add("reading");
  try { history.replaceState(null, "", "#" + id); } catch {}
  if (user) { el.scrollIntoView({ block: "start", behavior: "instant" }); }
  render();
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("markall").onclick = () => { visible().forEach(f => read.add(f.id)); saveRead(); render(); };
document.getElementById("markallun").onclick = () => { visible().forEach(f => read.delete(f.id)); saveRead(); render(); };

// Opening another player's link on an already-open page only changes the #fragment, so catch that and reload.
window.addEventListener("hashchange", () => { if ((location.hash || "").startsWith("#k=")) { takeKeys(); location.reload(); } });
(async () => {
  const keys = takeKeys();
  const personal = await unseal(keys);
  files = DATA.files.concat(personal).sort(byDate);
  [...new Set(files.flatMap(f => f.locales))].sort().forEach(c => chip(document.getElementById("cosms"), c, state.cosms, cv(c)));
  ["Dispatch", "Rumor"].concat(personal.length ? ["Personal"] : []).forEach(t => chip(document.getElementById("types"), t, state.types));
  if (Object.keys(keys).length) {
    const who = [...new Set(personal.map(p => p.to))];
    const foot = document.getElementById("foot");
    foot.innerHTML = `${who.length ? `Personal correspondence for ${who.join(", ")} is shown on this device only · ` : "Personal access is set up on this device · "}<button type="button" id="forget" class="linkbtn">Remove personal access</button>`;
    document.getElementById("forget").onclick = () => { store.set("dfa-keys", {}); location.reload(); };
  }
  const hash = (location.hash || "").slice(1);
  render();
  open(files.some(f => f.id === hash) ? hash : visible()[0].id, false);
  if (!hash && window.matchMedia("(max-width: 760px)").matches) document.getElementById("app").classList.remove("reading");
})();
</script>

</body>
